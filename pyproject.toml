[project]
name = "anilist2playlist"
version = "0.1.0"
description = "Fetch the seasonal anime list from AniList and turn it into a watch-playlist TSV"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/bjuergens/seasonal_al_watchorder"

[project.scripts]
anilist2playlist = "anilist2playlist.cli:main"

[dependency-groups]
dev = ["mypy", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
]

[tool.mypy]
strict = true
files = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anilist2playlist"]
