[project]
name = "anilist2playlist"
version = "0.1.0"
description = "Fetch the seasonal anime list from AniList and turn it into a watch-playlist CSV"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
anilist2playlist = "anilist2playlist.cli:main"

[dependency-groups]
dev = ["mypy"]

[tool.mypy]
strict = true
files = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anilist2playlist"]
