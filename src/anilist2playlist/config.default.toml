# anilist2playlist config. The season is selected by the --special-date CLI param.

raw_file = "raw.json"
output = "playlist.tsv"
pin_top = 5                # the top N non-skipped shows keep their AL Rank order
tag_cutoff = 10            # keep only each show's top N tags (by tag rank)
cache_max_age_hours = 24   # warn when the raw cache is older than this

# Watch order adjustments, added to the AniList popularity rank (lower = watch
# earlier). Addidative Adjustment-Number or  "skip"
[weights]
sequel = "skip"
side_story = "skip"

# Note: you can combine keys with " + " (spaces required, since a
# bare "+" can be part of a tag name).
[weights.genres]
"Action + Adventure" = 5
"Action + Fantasy" = 5

# tags only match the first tag_cutoff
[weights.tags]
Isekai = 5
"Primarily Animal Cast" = -5
"Boys' Love" = -5
"School + Shounen" = 5
"LGBTQ+ Themes + War" = -5

[weights.sources]
ORIGINAL = -10
LIGHT_NOVEL = 5
